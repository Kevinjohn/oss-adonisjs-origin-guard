name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The same packed-package smoke the release gate runs, so export-map and alias breaks fail here.
      - name: Smoke the packed package
        run: |
          rm -rf tmp/checks && mkdir -p tmp/checks
          pnpm pack --pack-destination tmp/checks >/dev/null
          bash bin/smoke_packed_package.sh "$(ls tmp/checks/*.tgz)"
